name: Fetch artwork photos

# Downloads the artwork photos listed in scripts/image-sources.json from
# Wikimedia Commons and commits them to the branch. Runs only when the list,
# the script or this file changes (or by hand). Its own commit touches only
# public/images/ and scripts/image-credits.json, and pushes made with
# GITHUB_TOKEN never start workflows, so it cannot trigger itself.

on:
  push:
    branches: [claude/louvre-0.5-app]
    paths:
      - scripts/image-sources.json
      - scripts/fetch-images.mjs
      - .github/workflows/fetch-images.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-images
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-images.mjs
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images scripts/image-credits.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Add artwork photos from Wikimedia Commons" \
            -m "Downloaded by .github/workflows/fetch-images.yml; author, licence and source page of each file are in scripts/image-credits.json." \
            -m "Co-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_0184qQRNq3EDUeoBUs6ASDUG"
          git push
